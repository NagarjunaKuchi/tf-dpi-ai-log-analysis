# Configuration skeleton. No credentials are hardcoded: every secret comes from the environment
# (Kubernetes Secret / Vault). Property keys under spring.ai.* follow Spring AI 1.0.x and are UNVERIFIED
# until the first real build.
spring:
  application:
    name: dpi-agentic-rag-log-analysis
  datasource:
    url: ${DPI_DB_URL}
    username: ${DPI_DB_USER}
    password: ${DPI_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DPI_DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 5000
      max-lifetime: 1500000
  flyway:
    enabled: true
  ai:
    model:
      chat: ollama        # switch both to 'openai' to use an OpenAI-compatible vLLM server
      embedding: ollama
      # only chat + embedding are used; the OpenAI starter would otherwise demand an API key for these
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    retry:   # Spring AI defaults are 10 attempts with 5x backoff (minutes); keep model-call retries tightly bounded
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    ollama:
      base-url: ${DPI_OLLAMA_URL:http://ollama:11434}
      chat:
        options:
          model: ${DPI_CHAT_MODEL:llama3.1:8b}
          temperature: 0.1
          num-ctx: ${DPI_CHAT_NUM_CTX:8192}      # Ollama's default window is small and silently truncates long prompts
          num-predict: ${DPI_CHAT_NUM_PREDICT:1024}
      embedding:
        options:
          model: ${DPI_EMBEDDING_MODEL:bge-m3}
  lifecycle:
    timeout-per-shutdown-phase: 60s
  task:
    scheduling:
      pool:
        size: 2
      shutdown:
        await-termination: true
        await-termination-period: 60s

server:
  shutdown: graceful
  tomcat:
    threads:
      max: ${DPI_HTTP_THREADS:100}
    accept-count: 100

management:
  server:
    port: ${DPI_MANAGEMENT_PORT:8081}   # actuator on its own port; never expose it through the Ingress, restrict by NetworkPolicy
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

dpi:
  elasticsearch:
    uris: ${DPI_ES_URIS}
    index-pattern: ${DPI_ES_INDEX_PATTERN:logstash-*}
    username: ${DPI_ES_USER:}
    password: ${DPI_ES_PASSWORD:}
    api-key: ${DPI_ES_API_KEY:}
    ca-certificate-path: ${DPI_ES_CA_PATH:}
    connect-timeout: 5s
    socket-timeout: 30s
    page-size: 500
    max-retries: 3
    initial-backoff: 500ms
    # Defaults match the MOSIP/DPI Logstash documents (see docs/ONBOARDING-APPLICATION.md): service=kubernetes.container_name,
    # host=kubernetes.pod_name, level, traceId, @timestamp; error code and stack trace are derived from the message.
    # keyword-suffix: .keyword          # exact-value sub-field used for filters (dynamic mapping); "" if the fields are keywords
    # fields: { service: kubernetes.container_name, level: level, stack-trace: stack_trace }
    # mapping:
    #   timestamp-formats: [iso, "dd/MMM/yyyy:HH:mm:ss Z"]   # iso | epoch_millis | epoch_seconds | DateTimeFormatter pattern
    #   timestamp-zone: UTC                                  # for patterns without an offset
    #   level-aliases: { E: ERROR, W: WARN }
    #   exception-pattern: ""                                # regex, exception type in group 1
  masking:
    max-input-chars: 2000000
    max-duration: 2s
    additional-sensitive-json-keys: []
  chunking:
    max-chunk-tokens: 512
    max-gap: 60s
    max-span: 10m
    overlap-events: 1
    max-frames-per-exception: 8
  embedding:
    model-name: bge-m3
    model-version: ${DPI_EMBEDDING_MODEL_VERSION:1}
    dimensions: 1024
    batch-size: 32
    timeout: 30s
  ingestion:
    enabled: ${DPI_INGESTION_ENABLED:true}
    stream-name: ${DPI_INGESTION_STREAM:logstash}
    batch-size: 500
    max-batches-per-run: 20
    max-batch-attempts: 3
    retry-backoff: 2s
    interval: 5m
    lookback: 24h
    min-level: WARN
    retention: 30d
    shutdown-grace: 60s
  agent:
    max-retrieval-retries: 2
    max-verification-retries: 2
    timeout: 120s
  security:
    jwt-issuer-uri: ${DPI_JWT_ISSUER_URI:}
    jwk-set-uri: ${DPI_JWK_SET_URI:}      # only when the IdP is reached under a different address than its `iss`
    audience: ${DPI_JWT_AUDIENCE:dpi-log-analysis}
    rate-limit-per-minute: 60
