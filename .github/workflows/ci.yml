name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository. Docker Hub access comes from repository secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Test (unit + PostgreSQL/pgvector integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dpi_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway service container reachable only from this job; no password to leak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d dpi_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The integration tests DROP and re-migrate the public schema of this disposable database on every run.
      DPI_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/dpi_test
      DPI_TEST_JDBC_USER: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp verify
      - name: Fail if integration tests were silently skipped
        run: |
          skipped=$(grep -h -o 'skipped="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -v 'skipped="0"' || true)
          if [ -n "$skipped" ]; then echo "Some tests were skipped (database not used?):"; echo "$skipped"; exit 1; fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  chart:
    name: Helm chart (lint, render, schema-validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Install kubeconform (checksum pinned)
        run: |
          curl -sSfL -o kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kc.tgz" | sha256sum -c -
          tar xzf kc.tgz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate
        run: |
          set -euo pipefail
          chart=deploy/helm/dpi-log-analysis
          vals="--set config.dbUrl=jdbc:postgresql://pg:5432/dpi --set config.jwtIssuerUri=https://idp.example.org --set config.esUris=https://es.example.org:9200 --set existingSecret=dpi-secrets"
          helm lint $chart $vals
          helm template r $chart $vals | kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas
          helm template r $chart $vals --set ingress.enabled=true --set ingress.host=dpi.example.org --set autoscaling.enabled=true --set serviceMonitor.enabled=true --set llm.ollama.deploy=true \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas

  image:
    name: Build, scan and push image
    needs: [test, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Repository secret DOCKERHUB_USERNAME; optional repository variable DOCKERHUB_IMAGE (e.g. myorg/dpi-log-analysis) overrides.
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/dpi-log-analysis', secrets.DOCKERHUB_USERNAME || 'local') }}
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build image (not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          push: false
          tags: dpi-log-analysis:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fails on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dpi-log-analysis:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
