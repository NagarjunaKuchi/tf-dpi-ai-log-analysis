apiVersion: v1
kind: Service
metadata:
  name: {{ include "dpi.fullname" . }}
  labels: {{- include "dpi.labels" . | nindent 4 }}
spec:
  selector: {{- include "dpi.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
---
# Headless-style service for metrics scraping only; not routed by the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dpi.fullname" . }}-metrics
  labels: {{- include "dpi.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  selector: {{- include "dpi.selector" . | nindent 4 }}
  ports:
    - { name: management, port: {{ .Values.service.managementPort }}, targetPort: management }
